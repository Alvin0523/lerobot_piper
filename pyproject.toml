# ==========================================
# PIXI USAGE NOTES
# ==========================================
#
# This project uses Pixi (https://pixi.sh/) for environment and task management.
#
# - To install all dependencies: pixi install
# - To enter the environment shell: pixi shell
# - To run a task: pixi run <task>
# - To install with extra deps: pixi install -e aloha / pusht / xarm / dynamixel etc.
# - To enter an environment shell: pixi shell -e aloha
# - To run a task in an environment: pixi run -e aloha train
#
# You do NOT need to use pip or conda directly. Pixi handles all dependencies and environments.
#
# See README.md and https://pixi.sh/docs/ for more info.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage      = "https://huggingface.co/lerobot"
documentation = "https://huggingface.co/docs/lerobot/index"
source        = "https://github.com/huggingface/lerobot"
issues        = "https://github.com/huggingface/lerobot/issues"
discord       = "https://discord.gg/s3KuuzsPFb"

[project]
name        = "lerobot"
version     = "0.3.3"
description = "🤗 LeRobot: State-of-the-art Machine Learning for Real-World Robotics in Pytorch"
readme      = "README.md"
license     = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Rémi Cadène",         email = "re.cadene@gmail.com" },
    { name = "Simon Alibert",       email = "alibert.sim@gmail.com" },
    { name = "Alexander Soare",     email = "alexander.soare159@gmail.com" },
    { name = "Quentin Gallouédec",  email = "quentin.gallouedec@ec-lyon.fr" },
    { name = "Steven Palma",        email = "imstevenpmwork@ieee.org" },
    { name = "Pepijn Kooijmans",    email = "pepijnkooijmans@outlook.com" },
    { name = "Michel Aractingi",    email = "michel.aractingi@gmail.com" },
    { name = "Adil Zouitine",       email = "adilzouitinegm@gmail.com" },
    { name = "Dana Aubakirova",     email = "danaaubakirova17@gmail.com" },
    { name = "Caroline Pascal",     email = "caroline8.pascal@gmail.com" },
    { name = "Martino Russi",       email = "nopyeps@gmail.com" },
    { name = "Thomas Wolf",         email = "thomaswolfcontact@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["lerobot", "huggingface", "robotics", "machine learning", "artificial intelligence"]
# dependencies managed by pixi, see [tool.pixi.pypi-dependencies] below
dependencies = []

# ---------------- Tool Configurations ----------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length    = 110
exclude = ["tests/artifacts/**/*.safetensors", "*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "T20", "N"]
ignore = ["E501", "T201", "T203", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party  = ["lerobot"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false
line-ending              = "auto"
docstring-code-format    = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "benchmarks",
    "src/lerobot/datasets/push_dataset_to_hub",
    "src/lerobot/datasets/v2/convert_dataset_v1_to_v2",
    "src/lerobot/policies/pi0/conversion_scripts",
    "src/lerobot/scripts/push_dataset_to_hub.py",
]
skips = ["B101", "B311", "B404", "B603", "B615"]

[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]
default.extend-ignore-identifiers-re = ["2nd", "pn", "ser", "ein"]

# ==========================================
# PIXI CONFIGURATION
# ==========================================

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = ["linux-aarch64"]

[tool.pixi.system-requirements]
cuda = "12.1"

[tool.pixi.dependencies]
python = "3.10.*"
ffmpeg = ">=7.1.1"
cmake  = ">=3.29"

[tool.pixi.pypi-dependencies]
lerobot = { path = ".", editable = true }
# huggingface
datasets        = ">=2.19.0,<=3.6.0"
diffusers       = ">=0.27.2"
huggingface-hub = ">=0.34.2"
# core
einops                 = ">=0.8.0"
opencv-python-headless = ">=4.9.0"
av                     = ">=14.2.0"
jsonlines              = ">=4.0.0"
packaging              = ">=24.2"
pynput                 = ">=1.7.7"
pyserial               = ">=3.5"
wandb                  = ">=0.20.0"
torch                  = ">=2.2.1,<2.8.0"
torchvision            = ">=0.21.0,<0.23.0"
draccus                = "==0.10.0"
gymnasium              = ">=0.29.1,<1.0.0"
rerun-sdk              = ">=0.21.0"
# support
deepdiff   = ">=7.0.1,<9.0.0"
flask      = ">=3.0.3,<4.0.0"
imageio    = { version = ">=2.34.0,<3.0.0", extras = ["ffmpeg"] }
termcolor  = ">=2.4.0,<4.0.0"
piper-sdk  = ">=0.4.1"
wego-piper = ">=0.0.2"

[tool.pixi.tasks]
# robot tasks
train        = { cmd = "python -m lerobot.scripts.train",  env = { PYTHONNOUSERSITE = "1" } }
eval         = { cmd = "python -m lerobot.scripts.eval",   env = { PYTHONNOUSERSITE = "1" } }
calibrate    = { cmd = "python -m lerobot.calibrate",      env = { PYTHONNOUSERSITE = "1" } }
find-cameras = { cmd = "python -m lerobot.find_cameras",   env = { PYTHONNOUSERSITE = "1" } }
find-port    = { cmd = "python -m lerobot.find_port",      env = { PYTHONNOUSERSITE = "1" } }
record       = { cmd = "python -m lerobot.record",         env = { PYTHONNOUSERSITE = "1" } }
replay       = { cmd = "python -m lerobot.replay",         env = { PYTHONNOUSERSITE = "1" } }
setup-motors = { cmd = "python -m lerobot.setup_motors",   env = { PYTHONNOUSERSITE = "1" } }
teleoperate  = { cmd = "python -m lerobot.teleoperate",    env = { PYTHONNOUSERSITE = "1" } }
# dev tasks
lint         = { cmd = "ruff check .",                     env = { PYTHONNOUSERSITE = "1" } }
format       = { cmd = "ruff format .",                    env = { PYTHONNOUSERSITE = "1" } }
test         = { cmd = "pytest tests/",                    env = { PYTHONNOUSERSITE = "1" } }
security     = { cmd = "bandit -r src/",                   env = { PYTHONNOUSERSITE = "1" } }

[tool.pixi.environments]
# sim
aloha       = { features = ["aloha"] }
pusht       = { features = ["pusht"] }
xarm        = { features = ["xarm"] }
# hardware
dynamixel   = { features = ["dynamixel"] }
feetech     = { features = ["feetech"] }
gamepad     = { features = ["gamepad"] }
hopejr      = { features = ["hopejr"] }
lekiwi      = { features = ["lekiwi"] }
kinematics  = { features = ["kinematics"] }
realsense   = { features = ["intelrealsense"] }
# policies
pi0         = { features = ["pi0"] }
smolvla     = { features = ["smolvla"] }
hilserl     = { features = ["hilserl"] }
# features
grpc       = { features = ["async"] }
# dev / test
dev         = { features = ["dev"] }
test        = { features = ["test"] }
video-bench = { features = ["video_benchmark"] }

# --- sim environments ---

[tool.pixi.feature.aloha.pypi-dependencies]
gym-aloha = ">=0.1.1"

[tool.pixi.feature.pusht.pypi-dependencies]
gym-pusht = ">=0.1.5"
pymunk    = ">=6.6.0,<7.0.0"

[tool.pixi.feature.xarm.pypi-dependencies]
gym-xarm = ">=0.1.1"

# --- hardware ---

[tool.pixi.feature.dynamixel.pypi-dependencies]
dynamixel-sdk = ">=3.7.31"

[tool.pixi.feature.feetech.pypi-dependencies]
